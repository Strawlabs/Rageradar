<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="100" cy="100" r="85" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Holographic Keyboard screen behind -->
  <path d="M 40 145 L 160 145" stroke="url(#glow-grad)" stroke-width="2" filter="url(#glow)" />
  <rect x="50" y="150" width="100" height="15" rx="3" fill="none" stroke="url(#glow-grad)" stroke-width="1" stroke-dasharray="2 3" opacity="0.8" />

  <!-- Elephant -->
  <g transform="translate(45, 30)">
    <!-- Ears -->
    <path d="M 25 50 C -10 25 5 -5 30 20 Z" fill="url(#body-grad)" opacity="0.8" />
    <path d="M 85 50 C 120 25 105 -5 80 20 Z" fill="url(#body-grad)" opacity="0.8" />
    
    <!-- Head -->
    <circle cx="55" cy="50" r="32" fill="url(#body-grad)" />
    
    <!-- Eyes -->
    <circle cx="45" cy="45" r="4.5" fill="#fff" />
    <circle cx="65" cy="45" r="4.5" fill="#fff" />
    <circle cx="45" cy="45" r="2" fill="#1e293b" />
    <circle cx="65" cy="45" r="2" fill="#1e293b" />
    
    <!-- Trunk (pointing down at keyboard) -->
    <path d="M 55 60 Q 55 85 45 92" fill="none" stroke="url(#body-grad)" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
