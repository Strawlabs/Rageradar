<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="angry-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Main shape: glowing diamond/shield -->
  <rect x="15" y="15" width="70" height="70" rx="20" fill="url(#angry-grad)" filter="url(#glow)" />
  <rect x="18" y="18" width="64" height="64" rx="17" fill="none" stroke="#fecaca" stroke-width="1.5" opacity="0.5" />
  
  <!-- Angry Emoji Face inside -->
  <g transform="translate(25, 25)">
    <!-- Angry Eyebrows -->
    <path d="M 8 20 L 22 26" stroke="#fff" stroke-width="4" stroke-linecap="round" />
    <path d="M 42 20 L 28 26" stroke="#fff" stroke-width="4" stroke-linecap="round" />
    
    <!-- Angry Eyes -->
    <circle cx="12" cy="32" r="4" fill="#fff" />
    <circle cx="38" cy="32" r="4" fill="#fff" />
    
    <!-- Angry Mouth -->
    <path d="M 15 45 Q 25 38 35 45" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
