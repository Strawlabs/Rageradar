<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="price-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="85" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="14 4" opacity="0.4" />

  <!-- Elephant -->
  <g transform="translate(45, 40)">
    <!-- Ears -->
    <path d="M 25 50 C -10 25 5 -5 30 20 Z" fill="url(#body-grad)" opacity="0.8" />
    <path d="M 85 50 C 120 25 105 -5 80 20 Z" fill="url(#body-grad)" opacity="0.8" />
    
    <!-- Head -->
    <circle cx="55" cy="50" r="32" fill="url(#body-grad)" />
    
    <!-- Eyes -->
    <circle cx="45" cy="45" r="4.5" fill="#fff" />
    <circle cx="65" cy="45" r="4.5" fill="#fff" />
    <circle cx="45" cy="45" r="2" fill="#1e293b" />
    <circle cx="65" cy="45" r="2" fill="#1e293b" />
    
    <!-- Trunk (carrying pricing badge) -->
    <path d="M 55 60 Q 55 80 72 80" fill="none" stroke="url(#body-grad)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Pricing tag / Ticket badge -->
    <g transform="translate(70, 48)">
      <rect x="0" y="0" width="30" height="42" rx="4" fill="url(#price-grad)" transform="rotate(15)" />
      <!-- Tag hole -->
      <circle cx="8" cy="8" r="2" fill="#fff" transform="rotate(15)" />
      <!-- Dollar sign inside tag -->
      <text x="14" y="26" fill="#fff" font-size="18" font-weight="900" text-anchor="middle" font-family="sans-serif" transform="rotate(15)">$</text>
    </g>
  </g>
</svg>
