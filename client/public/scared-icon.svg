<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="scared-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Main shape: glowing diamond/shield -->
  <rect x="15" y="15" width="70" height="70" rx="20" fill="url(#scared-grad)" filter="url(#glow)" />
  <rect x="18" y="18" width="64" height="64" rx="17" fill="none" stroke="#ffedd5" stroke-width="1.5" opacity="0.5" />
  
  <!-- Scared Face inside -->
  <g transform="translate(25, 25)">
    <!-- Scared Eyebrows -->
    <path d="M 8 18 Q 15 12 22 18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <path d="M 42 18 Q 35 12 28 18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    
    <!-- Scared Eyes (Large open) -->
    <circle cx="12" cy="28" r="5" fill="#fff" />
    <circle cx="38" cy="28" r="5" fill="#fff" />
    <circle cx="12" cy="28" r="2" fill="#1e293b" />
    <circle cx="38" cy="28" r="2" fill="#1e293b" />
    
    <!-- Gasping Mouth (O shape) -->
    <ellipse cx="25" cy="44" rx="7" ry="9" fill="#fff" />
  </g>
</svg>
