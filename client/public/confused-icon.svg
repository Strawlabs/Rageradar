<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="conf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Main shape: glowing diamond/shield -->
  <rect x="15" y="15" width="70" height="70" rx="20" fill="url(#conf-grad)" filter="url(#glow)" />
  <rect x="18" y="18" width="64" height="64" rx="17" fill="none" stroke="#f3e8ff" stroke-width="1.5" opacity="0.5" />
  
  <!-- Confused Face inside -->
  <g transform="translate(25, 25)">
    <!-- Confused Eyebrows (One high, one low) -->
    <path d="M 8 18 Q 15 12 22 18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <path d="M 42 22 Q 35 24 28 20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    
    <!-- Confused Eyes (One small, one big) -->
    <circle cx="12" cy="28" r="3" fill="#fff" />
    <circle cx="38" cy="28" r="5" fill="#fff" />
    <circle cx="38" cy="28" r="2" fill="#1e293b" />
    
    <!-- Slandered Mouth -->
    <path d="M 15 44 Q 25 40 35 48" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
