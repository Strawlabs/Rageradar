<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Grid -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#logo-grad)" stroke-width="1" stroke-dasharray="4 4" opacity="0.3" />
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#logo-grad)" stroke-width="1.5" opacity="0.5" />
  <circle cx="50" cy="50" r="22" fill="none" stroke="url(#logo-grad)" stroke-width="1" stroke-dasharray="2 2" opacity="0.7" />
  
  <!-- Crosshairs -->
  <line x1="5" y1="50" x2="95" y2="50" stroke="url(#logo-grad)" stroke-width="0.5" opacity="0.3" />
  <line x1="50" y1="5" x2="50" y2="95" stroke="url(#logo-grad)" stroke-width="0.5" opacity="0.3" />
  
  <!-- Radar sweep line -->
  <line x1="50" y1="50" x2="82" y2="18" stroke="url(#logo-grad)" stroke-width="2" filter="url(#glow)" />
  <circle cx="82" cy="18" r="4" fill="#ef4444" filter="url(#glow)" />

  <!-- Stylized Elephant Head in Center -->
  <g transform="translate(32, 35) scale(0.7)">
    <!-- Ears -->
    <path d="M 5 20 Q -15 0 0 -15 Q 10 -15 20 5 Z" fill="url(#logo-grad)" opacity="0.8" />
    <path d="M 45 20 Q 65 0 50 -15 Q 40 -15 30 5 Z" fill="url(#logo-grad)" opacity="0.8" />
    <!-- Head -->
    <circle cx="25" cy="15" r="17" fill="url(#logo-grad)" />
    <!-- Trunk -->
    <path d="M 25 25 Q 25 42 34 42 Q 39 42 39 37" fill="none" stroke="url(#logo-grad)" stroke-width="5" stroke-linecap="round" />
    <!-- Eyes (Glowing) -->
    <circle cx="17" cy="12" r="2" fill="#fff" />
    <circle cx="33" cy="12" r="2" fill="#fff" />
  </g>
</svg>
