<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="alert-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="100" cy="100" r="85" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.4" />
  
  <g transform="translate(45, 40)">
    <!-- Ears -->
    <path d="M 25 50 C -10 25 5 -5 30 20 Z" fill="url(#body-grad)" opacity="0.8" />
    <path d="M 85 50 C 120 25 105 -5 80 20 Z" fill="url(#body-grad)" opacity="0.8" />
    
    <!-- Head -->
    <circle cx="55" cy="50" r="32" fill="url(#body-grad)" />
    
    <!-- Eyes (Wide, alerted) -->
    <circle cx="43" cy="45" r="6" fill="#fff" />
    <circle cx="67" cy="45" r="6" fill="#fff" />
    <circle cx="43" cy="45" r="2.5" fill="#1e293b" />
    <circle cx="67" cy="45" r="2.5" fill="#1e293b" />
    
    <!-- Trunk (curled up alerting) -->
    <path d="M 55 62 Q 52 82 66 82 Q 74 82 72 70" fill="none" stroke="url(#body-grad)" stroke-width="9" stroke-linecap="round" />
    
    <!-- Red Alert Badge -->
    <g transform="translate(72, 10)" filter="url(#glow)">
      <circle cx="12" cy="12" r="14" fill="url(#alert-grad)" />
      <!-- Bell icon inside -->
      <path d="M 12 5 Q 16 5 16 9 L 17 14 L 7 14 L 8 9 Q 8 5 12 5 Z" fill="#fff" />
      <rect x="6" y="15" width="12" height="2" rx="1" fill="#fff" />
      <circle cx="12" cy="18" r="2.5" fill="#fff" />
    </g>
  </g>
</svg>
