name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm run install-all

      - name: Run configuration test
        run: npm run test-config

      # Add more tests here as you create them
      # - name: Run unit tests
      #   run: npm test

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build server image
        run: |
          cd server
          docker build -t rageradar-server:${{ github.sha }} .

      - name: Build client image
        run: |
          cd client
          docker build -t rageradar-client:${{ github.sha }} .

      - name: Test docker-compose
        run: |
          docker-compose config

  # Uncomment and configure when you're ready to deploy
